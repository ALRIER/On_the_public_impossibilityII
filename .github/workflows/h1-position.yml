name: H1 Anonymous Empirical Positioning

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/h1-position.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: h1-anonymous-positioning
  cancel-in-progress: false

jobs:
  h1:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        shard: [0,1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Validate public boundary
        run: python tools/validate_public_release.py
      - name: Execute H1 shard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python runtime/public_dispatcher.py
          --control .control/h1.json
          --shard ${{ matrix.shard }}
          --output-root outputs
      - name: Upload neutral output
        uses: actions/upload-artifact@v4
        with:
          name: h1-shard-${{ matrix.shard }}
          path: outputs/
