name: N6 exact-release evidence and postmortem export (public only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n6-verified-evidence-byte-staging.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify original source boundary and 8 exact public Release asset hashes
        run: |
          set -euo pipefail
          python tools/validate_public_release.py
          python tools/n6_evidence_export.py
      - name: Preserve reversible original data and verified source-derived N6 report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c n6-exact-original-evidence-staging-20261120
          git add staging/n6_20261120/archive_bytes.b64 staging/n6_20261120/manifest.json staging/n6_20261120/N6_VERIFIED_BOTTLENECK_REPORT.md staging/n6_20261120/N6_VERIFIED_EVIDENCE_SUMMARY.json
          git commit -m 'N6 original evidence and verified bottleneck reporting [skip ci]'
          git push --set-upstream origin n6-exact-original-evidence-staging-20261120
