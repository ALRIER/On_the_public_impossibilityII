name: N5 forward input coverage mechanism comparison - public-only engineering
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n5-forward-coverage-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: n5-forward-input-coverage-public
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Audit public boundary, legacy safety tests, and opt-in policy
        run: |
          python tools/validate_public_release.py
          python -m runtime.tasks.n5_clearing_tests
          python -m tools.n5_stage1_mechanism_gate
      - name: Compare old and new order coverage in matched physical-financial model
        run: python -m runtime.tasks.n5_forward_coverage_pilot
      - name: Fail closed on false original anchor or scientific certification claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/n5_forward_coverage_pilot/status.json').read_text())
          assert x['original_engine_default_preserved']
          assert x['technology_invariant']
          assert x['original_economic_anchors_mapped'] is False
          assert x['original_10_param_legacy_ABM_equivalence_certified'] is False
          assert x['q1_scientific_result_confirmed'] is False
          assert x['large_scale_screen_authorized'] is False
          print('New ordering option tested; scientific certification remains blocked.')
          PY
      - name: Archive all predeclared contrasts in immutable public release
        if: always()
        run: |
          set -euo pipefail
          mkdir -p archive
          sha256sum runtime/tasks/n5_clearing_engine.py runtime/tasks/n5_forward_coverage_pilot.py tools/n5_stage1_mechanism_gate.py > archive/source_sha256.txt
          (find outputs/n5_forward_coverage_pilot -type f -print0 2>/dev/null || true) | sort -z | xargs -0 -r sha256sum > archive/output_sha256.txt
          git rev-parse HEAD > archive/source_commit.txt
          tar -czf archive/neutral_forward_coverage_outputs.tar.gz -C outputs .
          tag="n5-public-forward-coverage-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" archive/neutral_forward_coverage_outputs.tar.gz archive/source_sha256.txt archive/output_sha256.txt archive/source_commit.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "N5 paired historical vs forward physical input coverage (engineering only)" \
            --notes "All prospectively specified positive/negative contrasts. Historical ordering untouched by default. Original eight economic-anchor mapping and full scientific inference NOT certified."
