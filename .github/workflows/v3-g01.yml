name: V3 Gate F01
on:
  push:
    paths:
      - ".control/final_gate.json"
permissions:
  contents: read
jobs:
  gate:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        anchor: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ALRIER/On_the_Impossibility_of_Central_Planning
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r runtime/code/requirements.txt
      - name: Execute neutral final gate
        env:
          AIDX: ${{ matrix.anchor }}
        run: |
          python runtime/code/stages/Test3/run_v3_gate_f01.py --anchor-index "$AIDX" --output-dir out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-g01-a${{ matrix.anchor }}
          path: out/
          retention-days: 90
