name: H1 Shard 8 Recovery

on:
  push:
    paths:
      - ".github/workflows/h1-shard8-recovery.yml"
      - "runtime/tasks/h1_position.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shard8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Validate public boundary
        run: python tools/validate_public_release.py
      - name: Execute H1 shard 8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python runtime/public_dispatcher.py
          --control .control/h1.json
          --shard 8
          --output-root outputs
      - name: Upload neutral output
        uses: actions/upload-artifact@v4
        with:
          name: h1-shard-8-recovery
          path: outputs/
