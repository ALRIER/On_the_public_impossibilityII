name: N5 next-stage public original-network multi-seed robustness (not certification)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/n5-next-stage-heterogeneity.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: n5-public-next-stage-robustness
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.13,<2'
      - name: Public boundary and unchanged engine baseline regression checks
        run: |
          python tools/validate_public_release.py
          python -m runtime.tasks.n5_clearing_tests
      - name: Run prespecified multi-seed 104-sector network-shock heterogeneity
        run: python -m runtime.tasks.n5_next_stage_network_heterogeneity
      - name: Fail closed unless original empirical limits retained
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s=json.loads(Path('outputs/n5_next_stage_heterogeneity/status.json').read_text())
          assert s['original_104_sector_technology_unchanged']
          assert s['original_six_network_bands_unchanged']
          assert s['original_frozen_networks_admissible']==4
          assert s['trajectory_count']==160
          assert s['paired_contrast_count']==128
          assert s['no_friction_placebo_pairs_checked']==4
          assert s['max_conservation_residual']<1e-9
          assert s['original_eight_economic_anchors_applied']==0
          assert not s['independent_scientific_confirmation']
          assert not s['large_scale_ml_economic_surrogate_training_authorized']
          print('Original-network multi-seed engineering results PASS; actual economic anchor certification BLOCKED.')
          PY
      - name: Preserve all results and source hashes in immutable public Release
        if: always()
        run: |
          set -euo pipefail
          mkdir -p archive
          sha256sum runtime/tasks/n5_clearing_engine.py runtime/tasks/n5_next_stage_network_heterogeneity.py runtime/tasks/n5_review_proofs.py public_bundle/n5_v1/m001.json public_bundle/n5_v1/t001.json > archive/sha256_sources.txt
          (find outputs/n5_next_stage_heterogeneity -type f -print0 2>/dev/null || true) | sort -z | xargs -0 -r sha256sum > archive/sha256_outputs.txt
          git rev-parse HEAD > archive/source_commit.txt
          tar -czf archive/n5_original_network_multiseed_robustness.tar.gz -C outputs .
          TAG="n5-public-next-stage-heterogeneity-${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" archive/n5_original_network_multiseed_robustness.tar.gz archive/sha256_sources.txt archive/sha256_outputs.txt archive/source_commit.txt \
            --repo "$GITHUB_REPOSITORY" --title "N5 original-structure multi-seed network-sensitivity (engineering only)" \
            --notes "Original 104-sector A, frozen Q2 six bands, 4 preregistered structures, inherited baseline, 2 seeds, 2 source disruptions, 2 stock policies, 2 finance regimes. Every zero and negative preserved. Original 8 economic anchors NOT adapted; no independent scientific confirmation."
